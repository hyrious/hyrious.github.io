<!DOCTYPE html><html lang="zh-Hans-CN"><head><meta charset="UTF-8"><title>如何去除 IRB 启动时打印的 ▽</title><meta name="author" content="hyrious"><meta name="color-scheme" content="light dark"><meta name="viewport" content="width=device-width"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="alternate" href="/feed.xml" type="application/rss+xml" title="hyrious.log"><link rel="stylesheet" crossorigin href="/i/index-Bm_mvj8U.css"></head><body class="post"><h2>如何去除 IRB 启动时打印的 ▽</h2><address>最后更新于 <time>2026-07-09</time></address><style>.μ0{color:#24292e;background-color:#fff}.μ1{color:#005cc5}.μ2{color:#24292e}.μ3{color:#6f42c1}.μ4{color:#6a737d}@media (prefers-color-scheme:dark){.μ0{color:#e1e4e8;background-color:#24292e}.μ1{color:#79b8ff}.μ2{color:#e1e4e8}.μ3{color:#b392f0}.μ4{color:#6a737d}}</style><p>IRB 启动时其依赖 Reline 会打印一个 <a target="_blank" rel="noopener" href="https://github.com/ruby/reline/blob/d32ed17/lib/reline.rb#L418">▽</a> 来探测 unicode 字符的渲染宽度，有点碍眼，找了一下怎么关闭这个探测，在 <code>~/.irbrc</code> 中加入如下代码即可：</p><pre class="shiki shiki-themes github-light github-dark μ0" tabindex="0"><code><span class="line"><span class="μ1">Reline</span><span class="μ2">.</span><span class="μ3">core</span><span class="μ2">.</span><span class="μ3">instance_variable_set</span><span class="μ2">(</span><span class="μ1">:@ambiguous_width</span><span class="μ2">, </span><span class="μ1">1</span><span class="μ2">) </span><span class="μ4"># ▽</span></span></code></pre><footer><p><a href="http://creativecommons.org/publicdomain/zero/1.0/">CC0</a> 2026 @ hyrious</p></footer></body></html>
