name: github pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 'latest'
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: |
          pnpm install
          pnpm build
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
